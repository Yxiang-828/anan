<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安安 AnAn — the whole story</title>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@19",
  "react-dom/client": "https://esm.sh/react-dom@19/client",
  "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
  "framer-motion": "https://esm.sh/framer-motion@12?deps=react@19,react-dom@19"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  :root { --bg:#0c0f17; --panel:#161b28; --line:#252c40; --ink:#e7ecf6; --dim:#95a0b6;
          --green:#35c26e; --blue:#5b8aff; --amber:#f0a53c; --red:#ef5350; --purple:#a78bfa; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,"PingFang SC",sans-serif; overflow-x:hidden; }
  ::selection { background:#35c26e44; }
  #root { min-height:100vh; display:block !important; height:auto !important; }
  .mono { font-family:ui-monospace,"SF Mono",monospace; }
  img, video { max-width:100%; }
  .sprite { image-rendering:pixelated; background-repeat:no-repeat; background-size:400% 100%;
            animation:bframes var(--bspeed,1.1s) steps(4) infinite; }
  @keyframes bframes { to { background-position-x:133.3333%; } }
  @media (prefers-reduced-motion: reduce) { .sprite { animation:none; } }
  /* A wide desktop capture cannot be read at phone width — 13px text lands at
     about 3px. Blowing it up to native size inline is worse: the frame simply
     fills with whatever sits in the capture's top-left corner. The pattern that
     works is a fitted preview that is REACHABLE — tap to open the asset full
     size, where the browser gives pinch-zoom, and video gets native fullscreen.
     The footage is never cropped; only the framing changes. */
  /* `phone` frames hold a portrait mockup composited centre-frame on a wide
     canvas. Fitting the whole canvas into a phone column renders the actual
     phone at ~90px — the subject is there and unreadable, surrounded by empty
     backdrop. Crop to the subject rather than shrink the canvas. No asset is
     modified; this is framing, and it reverses by deleting four lines. */
  @media (pointer: coarse) and (max-width: 820px) {
    .phone-crop img, .phone-crop video {
      width: 100%; aspect-ratio: 9 / 16; object-fit: cover; object-position: center;
    }
    .phone-crop { max-width: none !important; }
  }
  .wide-zoom { display: block; position: relative; }
  .wide-hint { display: none; }
  @media (pointer: coarse) and (max-width: 820px) {
    .wide-hint { display: block; font-size: 12.5px; color: var(--amber);
                 margin-top: 9px; letter-spacing: .04em; opacity: .9; }
  }
</style>
</head>
<body>
<div id="root">loading the story…</div>

<script type="text/babel" data-type="module">
import React, { useRef, useState } from 'react';
import { createRoot } from 'react-dom/client';
import { motion, useScroll, useSpring, useTransform, useMotionValueEvent } from 'framer-motion';

const EASE = [0.23, 1, 0.32, 1];
const A = 'story-assets';

/* ---------- primitives ---------- */
/* A flick moves a viewport per frame, so elements enter ALREADY on screen and
   then fade in late. The reader does not see motion, they see flashing — and no
   threshold or margin fixes it, because the element is genuinely in view before
   the observer can fire. The entrance is a desktop affordance; on touch the
   content is simply present and the scroll is smooth. */
const COARSE = typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches;
const Reveal = ({children, delay=0, y=26, style}) => (
  COARSE ? <div style={style}>{children}</div> : (
  <motion.div initial={{opacity:0, y}} whileInView={{opacity:1, y:0}}
    viewport={{once:true, margin:"-60px"}} transition={{duration:.7, delay, ease:EASE}} style={style}>
    {children}
  </motion.div>
  )
);
const Kicker = ({children}) => (
  <Reveal><p style={{fontSize:13, letterSpacing:'.24em', textTransform:'uppercase',
    color:'var(--amber)', marginBottom:14}}>{children}</p></Reveal>
);
const H = ({children, zh}) => (
  <Reveal><h2 style={{fontSize:'clamp(28px,4.2vw,50px)', lineHeight:1.14, marginBottom:12, textShadow:'0 2px 24px rgba(0,0,0,.6)'}}>
    {children}{zh && <span style={{display:'block', fontSize:'.5em', color:'var(--dim)', fontWeight:400, marginTop:8}}>{zh}</span>}
  </h2></Reveal>
);
const P = ({children, style}) => (
  <Reveal><p style={{fontSize:'clamp(15px,1.35vw,18px)', lineHeight:1.7, color:'#c3ccdf',
    maxWidth:760, margin:'14px 0', textShadow:'0 1px 12px rgba(0,0,0,.5)', ...style}}>{children}</p></Reveal>
);
const Grid = ({min=260, children}) => (
  <div style={{display:'grid', gridTemplateColumns:`repeat(auto-fit, minmax(min(100%, ${min}px), 1fr))`,
    gap:16, margin:'20px 0'}}>{children}</div>
);
const Card = ({title, color='var(--green)', children}) => (
  <Reveal style={{height:'100%'}}>
    <div style={{background:'rgba(22,27,40,.88)', border:'1px solid var(--line)', borderRadius:14,
      padding:'18px 20px', height:'100%', backdropFilter:'blur(6px)'}}>
      <p className="mono" style={{color, fontSize:14, marginBottom:8}}>{title}</p>
      <p style={{fontSize:14.5, lineHeight:1.6, color:'#b9c3d8'}}>{children}</p>
    </div>
  </Reveal>
);

/* full-bleed chapter with parallax background image */
function Full({img, pos='center', dim=.55, tall, children}) {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ["start end", "end start"] });
  const y = useTransform(scrollYProgress, [0, 1], ["-9%", "9%"]);
  const scale = useTransform(scrollYProgress, [0, 1], [1.08, 1.16]);
  return (
    <section ref={ref} style={{position:'relative', minHeight: tall?'auto':'100vh', overflow:'hidden',
      display:'flex', alignItems:'center'}}>
      <motion.div aria-hidden style={{position:'absolute', inset:'-10% 0', y, scale, zIndex:0,
        backgroundImage:`url(${A}/${img})`, backgroundSize:'cover', backgroundPosition:pos}}/>
      <div aria-hidden style={{position:'absolute', inset:0, zIndex:1, background:
        `linear-gradient(180deg, var(--bg) 0%, rgba(12,15,23,${dim}) 18%, rgba(12,15,23,${dim}) 82%, var(--bg) 100%)`}}/>
      <div style={{position:'relative', zIndex:2, maxWidth:1080, margin:'0 auto',
        padding:'14vh 28px', width:'100%'}}>{children}</div>
    </section>
  );
}
const Sec = ({children, style}) => (
  <section style={{maxWidth:1080, margin:'0 auto', padding:'11vh 28px', ...style}}>{children}</section>
);

/* screenshot / video in a framed device */
const Shot = ({src, cap, phone}) => (
  <Reveal>
    <figure style={{margin:'20px 0'}}>
      {phone
        ? <div className="phone-crop" style={{maxWidth:340, margin:'0 auto',
            borderRadius:26, overflow:'hidden', border:'1px solid var(--line)',
            boxShadow:'0 24px 70px rgba(0,0,0,.5)'}}>
            <img src={src} style={{width:'100%', display:'block'}}/>
          </div>
        : <a className="wide-zoom" href={src} target="_blank" rel="noopener">
            <img src={src} style={{width:'100%', display:'block', borderRadius:14,
              border:'1px solid var(--line)', boxShadow:'0 24px 70px rgba(0,0,0,.5)'}}/>
          </a>}
      {!phone && <div className="wide-hint">tap the frame to open it full size ↗</div>}
      {cap && <figcaption style={{fontSize:13.5, color:'var(--dim)', marginTop:10, lineHeight:1.55}}>{cap}</figcaption>}
    </figure>
  </Reveal>
);
const Vid = ({src, cap, phone}) => (
  <Reveal>
    <figure style={{margin:'20px 0'}}>
      {phone
        ? <div className="phone-crop" style={{borderRadius:26, border:'1px solid var(--line)',
            overflow:'hidden', boxShadow:'0 24px 70px rgba(0,0,0,.5)', background:'#000',
            maxWidth:300, margin:'0 auto'}}>
            <video src={`${A}/${src}`} autoPlay muted loop playsInline
              style={{width:'100%', display:'block'}}/>
          </div>
        : <div style={{borderRadius:14, border:'1px solid var(--line)', overflow:'hidden',
            boxShadow:'0 24px 70px rgba(0,0,0,.5)', background:'#000'}}>
            <video src={`${A}/${src}`} autoPlay muted loop playsInline controls
              style={{width:'100%', display:'block'}}/>
          </div>}
      {!phone && <div className="wide-hint">tap fullscreen to read the panes ↗</div>}
      {cap && <figcaption style={{fontSize:13.5, color:'var(--dim)', marginTop:10, lineHeight:1.55}}>{cap}</figcaption>}
    </figure>
  </Reveal>
);
/* live pixel bird from the real atlases the app ships */
const Bird = ({state='idle', size=88, speed='1.1s'}) => (
  <span className="sprite" aria-label={`${state} bird`} style={{display:'inline-block', width:size, height:size,
    backgroundImage:`url(${A}/${state}-atlas.png)`, '--bspeed':speed}}/>
);

/* ---------- sticky pipeline ---------- */
const PHASES = ['WAKE','THINK','REVALIDATE','GATE','ACT','RECEIPT','COMMIT'];
const PHASE_NOTE = [
  'a trigger arrives — a cron firing, a silence deadline, a touch on the screen, a Telegram tap. It is only the opportunity to inspect the world, never a command.',
  'the model chooses inside a bounded envelope — retry? escalate? wait once more? chat or relay to family? If the model fails, a deterministic floor decides instead.',
  'a decision born from an old snapshot re-checks the world before acting. A heartbeat that raced in kills the stale decision before anything external happens.',
  'a three-tier permission envelope: autonomous · family-approval · never. Emergency calls, medical advice and anything financial are hard-wired to never.',
  'the skill runs — speak, notify, escalate, log. Words come from the model at the moment of action, never from a script.',
  'what actually changed is recorded — delivery surfaces, message ids, real effects. Never just a return code.',
  'state commits. The next judge of this decision is the receipt row, not the narration.',
];
function Pipeline() {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ["start start", "end end"] });
  const idx = useTransform(scrollYProgress, [0, 1], [0, PHASES.length - 0.001]);
  const [cur, setCur] = useState(0);
  useMotionValueEvent(idx, "change", v => setCur(Math.max(0, Math.min(PHASES.length-1, Math.floor(v)))));
  return (
    <div ref={ref} style={{height:'320vh', position:'relative'}}>
      <div style={{position:'sticky', top:0, minHeight:'100vh', overflow:'hidden', display:'flex',
        flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px'}}>
        <div aria-hidden style={{position:'absolute', inset:0, backgroundImage:`url(${A}/receipts_macro.jpg)`,
          backgroundSize:'cover', backgroundPosition:'center', opacity:.22}}/>
        <div aria-hidden style={{position:'absolute', inset:0, background:'radial-gradient(ellipse at center, transparent 30%, var(--bg) 95%)'}}/>
        <p style={{position:'relative', fontSize:13, letterSpacing:'.24em', textTransform:'uppercase', color:'var(--amber)', marginBottom:26}}>
          every action · seven phases · seven receipts</p>
        <div style={{position:'relative', display:'flex', gap:10, flexWrap:'wrap', justifyContent:'center', maxWidth:1000}}>
          {PHASES.map((p,i)=>(
            <motion.span key={p} className="mono"
              animate={{ background: i===cur ? '#12331f' : 'rgba(22,27,40,.9)',
                         borderColor: i===cur ? '#35c26e' : '#252c40',
                         color: i===cur ? '#fff' : '#8a95ab',
                         scale: i===cur ? 1.08 : 1 }}
              transition={{duration:.3, ease:EASE}}
              style={{padding:'12px 16px', borderRadius:12, border:'1px solid', fontSize:'clamp(13px,1.6vw,19px)'}}>
              {p}
            </motion.span>
          ))}
        </div>
        <motion.p key={cur} initial={{opacity:0, y:10}} animate={{opacity:1, y:0}} transition={{duration:.4}}
          style={{position:'relative', marginTop:32, fontSize:'clamp(15px,1.5vw,19px)', color:'#c3ccdf', maxWidth:640,
          textAlign:'center', lineHeight:1.6, minHeight:110}}>
          <b className="mono" style={{color:'var(--green)'}}>{PHASES[cur]}</b> — {PHASE_NOTE[cur]}
        </motion.p>
        <p style={{position:'relative', marginTop:14, fontSize:13, color:'var(--dim)'}}>keep scrolling — the pipeline advances with you</p>
      </div>
    </div>
  );
}

/* ---------- sticky FSM walk ---------- */
const STATES = ['IDLE','CHECKIN_SENT','SILENCE_1','SILENCE_2','ESCALATED','RESOLVED'];
const STATE_NOTE = [
  '06:59 — Nothing is wrong. Dormancy is a first-class behavior: doing nothing is correct when nothing needs doing.',
  '07:30 — AnAn speaks first. A bilingual greeting that is also a question, and a 60-minute listening window arms silently behind it.',
  '08:31 — No touch. Silence is not nothing: retry on a second channel — a voice prompt this time.',
  '09:02 — Still nothing. Channels exhausted. A person may be in trouble. This minute is the reason the product exists.',
  '09:03 — The daughter’s real Telegram lights up with action buttons. No callback in 10 minutes? The tree WALKS: son, then neighbour — each hop its own idempotent receipt.',
  'One tap — ✅ 我已回电 — and the loop closes. A button callback, never a spoken promise. Any touch from 婆婆 herself resolves everything: every touch is a heartbeat.',
];
const SCOL = {IDLE:'var(--green)', CHECKIN_SENT:'var(--blue)', SILENCE_1:'var(--amber)',
              SILENCE_2:'var(--red)', ESCALATED:'var(--red)', RESOLVED:'var(--green)'};
const SBIRD = ['idle','talk','alert','alert','fly','happy'];
function FsmWalk() {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ["start start", "end end"] });
  const idx = useTransform(scrollYProgress, [0, 1], [0, STATES.length - 0.001]);
  const [cur, setCur] = useState(0);
  useMotionValueEvent(idx, "change", v => setCur(Math.max(0, Math.min(STATES.length-1, Math.floor(v)))));
  return (
    <div ref={ref} style={{height:'300vh', position:'relative'}}>
      <div style={{position:'sticky', top:0, minHeight:'100vh', overflow:'hidden', display:'flex',
        alignItems:'center', justifyContent:'center', padding:'0 24px'}}>
        <div aria-hidden style={{position:'absolute', inset:0, backgroundImage:`url(${A}/night_block.jpg)`,
          backgroundSize:'cover', backgroundPosition:'center', opacity:.28}}/>
        <div aria-hidden style={{position:'absolute', inset:0, background:'radial-gradient(ellipse at center, transparent 20%, var(--bg) 96%)'}}/>
        <div style={{position:'relative', display:'flex', gap:'clamp(24px,4vw,64px)', alignItems:'center',
          flexWrap:'wrap', justifyContent:'center', maxWidth:1000}}>
          <div style={{flex:'1 1 420px', minWidth:'min(100%,420px)'}}>
            <p style={{fontSize:13, letterSpacing:'.24em', textTransform:'uppercase', color:'var(--amber)', marginBottom:20}}>
              one morning · the hero loop</p>
            <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:24}}>
              {STATES.map((s,i)=>(
                <motion.span key={s} className="mono"
                  animate={{ borderColor: i===cur ? SCOL[s] : '#252c40',
                             color: i===cur ? SCOL[s] : '#66718a',
                             background: i===cur ? 'rgba(22,27,40,.95)' : 'rgba(22,27,40,.6)' }}
                  transition={{duration:.3}}
                  style={{padding:'8px 12px', borderRadius:10, border:'1px solid', fontSize:'clamp(12.5px,1.2vw,14px)'}}>
                  {s}
                </motion.span>
              ))}
            </div>
            <motion.p key={cur} initial={{opacity:0, y:8}} animate={{opacity:1, y:0}} transition={{duration:.4}}
              style={{fontSize:'clamp(15px,1.5vw,18.5px)', lineHeight:1.65, color:'#c3ccdf', minHeight:120}}>
              {STATE_NOTE[cur]}
            </motion.p>
            <p style={{marginTop:12, fontSize:13, color:'var(--dim)'}}>scroll — the morning unfolds</p>
          </div>
          <motion.div key={'b'+cur} initial={{scale:.9, opacity:.5}} animate={{scale:1, opacity:1}}
            transition={{duration:.35, ease:EASE}} style={{textAlign:'center'}}>
            <Bird state={SBIRD[cur]} size={120} speed={cur===3?'0.5s':'1s'}/>
            <p className="mono" style={{marginTop:10, fontSize:13, color:SCOL[STATES[cur]]}}>{STATES[cur]}</p>
          </motion.div>
        </div>
      </div>
    </div>
  );
}

/* ---------- progress bar + link row ---------- */
function Progress() {
  const { scrollYProgress } = useScroll();
  const scaleX = useSpring(scrollYProgress, { stiffness: 120, damping: 24 });
  return <motion.div style={{position:'fixed', top:0, left:0, right:0, height:3, zIndex:50,
    transformOrigin:'0 0', scaleX,
    background:'linear-gradient(90deg,var(--green),var(--blue),var(--amber),var(--red),var(--purple))'}}/>;
}
const LINKS = [
  ['▶ Live demo','https://anan-iax1.onrender.com','#12331f','#6fdc9a'],
  ['📊 Slides (PDF)','AnAn-Deck-SyntaxError.pdf','#182642','#8fb4ff'],
  ['🎬 Demo video','https://youtu.be/wId_GYlmgmU','#3a2b12','#f0c56a'],
  ['💻 GitHub','https://github.com/Yxiang-828/anan','#241b3d','#c9b3f5'],
];
const LinkRow = () => (
  <Reveal><div style={{display:'flex', gap:12, flexWrap:'wrap', justifyContent:'center'}}>
    {LINKS.map(([t,h,bg,fg])=>(
      <a key={t} href={h} style={{background:bg, color:fg, padding:'12px 20px', borderRadius:12,
        textDecoration:'none', fontWeight:600, fontSize:15, border:'1px solid var(--line)'}}>{t}</a>
    ))}
  </div></Reveal>
);

function App() {
  return (
    <div>
      <Progress/>

      {/* 0 · HERO */}
      <Full img="hero_dawn.jpg" dim={.42}>
        <div style={{textAlign:'center'}}>
          <Reveal><div style={{marginBottom:6}}><Bird state="idle" size={104}/></div></Reveal>
          <Reveal delay={.1}><h1 style={{fontSize:'clamp(44px,8vw,96px)', lineHeight:1.05, textShadow:'0 2px 30px rgba(0,0,0,.6)'}}>
            <span style={{color:'#c9d2e4'}}>安安</span> <span style={{color:'var(--green)'}}>AnAn</span></h1></Reveal>
          <Reveal delay={.2}><p style={{fontSize:'clamp(20px,3vw,32px)', color:'var(--blue)', fontWeight:700, marginTop:10}}>
            Silence is an input.</p></Reveal>
          <Reveal delay={.3}><p style={{fontSize:'clamp(15px,1.6vw,19px)', color:'#c3ccdf', maxWidth:640, margin:'16px auto 26px', lineHeight:1.6}}>
            An autonomous companion for seniors living alone — and the honest story of how one human
            and a fleet of AI agents built it, receipt by receipt.</p></Reveal>
          <LinkRow/>
          <Reveal delay={.5}><p style={{marginTop:'8vh', fontSize:13, color:'var(--dim)'}}>scroll ↓</p></Reveal>
        </div>
      </Full>

      {/* 1 · PROBLEM */}
      <Full img="night_block.jpg" dim={.5}>
        <Kicker>chapter 01 · the problem</Kicker>
        <H zh="独居老人，一个亮着的窗口">One window still lit.</H>
        <P>About <b style={{color:'var(--ink)'}}>88,400 seniors in Singapore live alone</b> — projected to reach
          150,000 by 2030. For most families the safety net is a nightly phone call. Between calls, nothing
          watches. A fall at 9 AM is discovered at 9 PM.</P>
        <Grid>
          <Card title="the reactive trap" color="var(--red)">Alarms and pendants need the elder to <b>do something</b> at the worst
            possible moment. Passive monitoring wakes up only after the harm.</Card>
          <Card title="the chatbot trap" color="var(--amber)">Companion apps answer beautifully when spoken to — and sit
            perfectly idle while their user lies on the kitchen floor.</Card>
          <Card title="the gap" color="var(--blue)">What's missing is an agent whose <b>inputs are time, silence and state</b> —
            not text. One that acts within 60 minutes of silence, not at the next phone call.</Card>
        </Grid>
      </Full>

      {/* 2 · INSIGHT */}
      <Full img="phone_table.jpg" dim={.55} tall>
        <Kicker>chapter 02 · the insight</Kicker>
        <H zh="沉默也是一种输入">A phone lying face-down is data.</H>
        <P>Every AI assistant today is a vending machine: insert prompt, receive answer. AnAn inverts the contract.
          The agent runs on a clock, not on a prompt. <b style={{color:'var(--ink)'}}>{'{time, silence, state}'}</b> are
          first-class inputs; text is just one more.</P>
        <P>Design started with vocabulary, not code — a 93-word polygon of what the agent may perceive, decide and do.
          If a behavior couldn't be named inside the polygon, it wasn't built.</P>
        <Shot src="img/polygon.png" cap="The design polygon — 93 words the whole system is spoken in: perceptions on one edge; decisions, actions and receipts on the others."/>
      </Full>

      {/* 3 · BUILD */}
      <Full img="build_night.jpg" dim={.55} tall>
        <Kicker>chapter 03 · the build</Kicker>
        <H zh="一个人 + 一支AI舰队">One human. A fleet of agents.</H>
        <P>Team SyntaxError is one person — Yao Xiang. The workforce was a fleet of AI agents with divided roles and
          <b style={{color:'var(--ink)'}}> review gates between them</b>, run like a small studio: an architect-builder
          wrote the kernel and this site; a second agent drew the pixel mascot and formally blocked the builder's
          sprite renderer in adversarial review until the frame math was proven; a third drafted deck copy that was
          rebuilt from scratch. Skills, doctrine and probe ledgers moved between agents as files, not vibes.</P>
        <Grid>
          <Card title="claude · kernel & product" color="var(--green)">Seven-phase decision pipeline, FSM, 9 skills, the console,
            elder & family apps, this story site. Every claim traced to a receipt row.</Card>
          <Card title="codex · the mascot" color="var(--purple)">Ten pixel bird states, four frames each, its own QA harness —
            then an adversarial review that reproduced a real defect in the builder's renderer and held the merge until it was fixed.</Card>
          <Card title="the method" color="var(--blue)">Peel working reference code first, measure before believing,
            archive every probe — failures included. A doc someone wrote is not evidence; a receipt is.</Card>
        </Grid>
        <P style={{marginTop:24}}>Why these nine skills and not thirty? Each answers a named eldercare failure mode
          from the evidence base — no skill exists because it was easy to build:</P>
        <Grid min={230}>
          <Card title="silence → greet_checkin + escalate_tree" color="var(--amber)">the 60-minute promise: check in, listen, walk the contact tree.</Card>
          <Card title="isolation → companion_chat + relay_family" color="var(--green)">talk, and carry words across the family gap — recipient-framed, receipt-confirmed.</Card>
          <Card title="medication → med_reminder" color="var(--blue)">prompts that arm an all-day silence net, not an alarm that beeps into a void.</Card>
          <Card title="wandering → safe_range" color="var(--red)">a geofence around home with a live map link and an all-clear, not a tracker dashboard.</Card>
          <Card title="invisible decline → health_scan + care_insight + family_bulletin" color="var(--purple)">daily reflection to the elder, anomaly fanout to guardians, an evening digest.</Card>
        </Grid>
        <P>Deliberately <b>not</b> built: fall-detection hardware claims, medical advice, emergency calls on the agent's
          own authority. Those live outside the permission envelope — <span className="mono">never</span> — because a
          hackathon demo must not pretend it can dial 995.</P>
      </Full>

      {/* 4 · KERNEL */}
      <Sec style={{paddingBottom:0}}>
        <Kicker>chapter 04 · the kernel</Kicker>
        <H zh="七个阶段，七张收据">Autonomy you can audit.</H>
        <P>The heart of AnAn is not a chatbot loop. It is a decision pipeline in which
          <b style={{color:'var(--ink)'}}> waking is not thinking, and thinking is not acting</b> — and every phase
          writes a receipt row into SQLite before the next may begin.</P>
      </Sec>
      <Pipeline/>
      <Sec style={{paddingTop:'4vh'}}>

heartbeat  elder_touch               at=08:31:07   ← the world moved

commit     action=CANCELLED          reason=heartbeat_raced_decision`}</pre></Reveal>

      {/* 9 · CONSOLE */}
      <Sec>
        <Kicker>chapter 09 · the console</Kicker>
        <H zh="解剖台">An operating theatre, not a UI.</H>
        <P>Judges can't wait three hours to watch a silence escalate — and an autonomous agent's whole value is
          invisible unless you can see it <i>deciding</i>. So the demo surface is a console that shows
          <b style={{color:'var(--ink)'}}> the anatomy and the behavior at once</b>: skill rack glowing as skills fire,
          planline narrating junctions, the receipt log scrolling, the guardian's Telegram mirrored live.</P>
        <P>The elder app runs <b>inside</b> the console in a real iframe — not a screenshot — so one screen holds

/* deterministic scroll hook for automated vetting: #vet-N-D scrolls to N/D of the page */
const vetScroll = () => {
  const m = location.hash.match(/^#vet-(\d+)-(\d+)$/);
  if (!m) return;
  scrollTo({ top: (document.documentElement.scrollHeight - innerHeight) * (+m[1] / +m[2]), behavior: 'instant' });
  let d = document.getElementById('vetdbg');
  if (!d) { d = document.createElement('div'); d.id = 'vetdbg';
    d.style.cssText = 'position:fixed;bottom:8px;left:8px;z-index:99;background:#000c;color:#0f0;font:12px monospace;padding:6px 10px;white-space:pre'; document.body.appendChild(d); }
  const imgs = [...document.images];
  d.textContent = `y=${Math.round(scrollY)} h=${document.documentElement.scrollHeight}`
    + ` imgs=${imgs.filter(i=>i.complete&&i.naturalWidth>0).length}/${imgs.length}`
    + ` err=${window.__err||'none'}`;
};
window.addEventListener('error', e => { window.__err = (e.message||'?').slice(0,120); vetScroll(); });
addEventListener('hashchange', vetScroll);
setTimeout(vetScroll, 2500);
setTimeout(vetScroll, 5500);
</script>
