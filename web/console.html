<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnAn 安安 · Demo</title>
<style>
  :root { --bg:#10141f; --panel:#1a2030; --ink:#dfe6f3; --dim:#7d8aa5; --line:#2a3350;
          --blue:#4f7cff; --green:#35c26e; --amber:#f0a53c; --red:#ef5350; --purple:#9b7ef0;
          --ease-out:cubic-bezier(0.23,1,0.32,1); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"JetBrains Mono","PingFang SC",monospace;
         min-height:100vh; display:flex; flex-direction:column; padding:14px 16px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; }
  .clock { font-size:24px; font-weight:700; color:#fff; background:#000; border-radius:8px; padding:2px 12px; }
  .badge { font-size:12px; color:var(--dim); }
  #langbtn { background:#232c44; color:var(--ink); border:1px solid var(--line); border-radius:8px;
             padding:5px 12px; font:inherit; font-size:12px; cursor:pointer; }
  #langbtn:hover { border-color:var(--blue); }
  #mascothead { display:flex; align-items:center; gap:6px; margin-left:auto; }
  #mascot { width:64px; height:64px; background-repeat:no-repeat; background-size:400% 100%;
            image-rendering:pixelated; display:flex; align-items:center; justify-content:center; font-size:34px; }
  #mascot.sprite { animation:cycle var(--bspeed,.55s) steps(4) infinite; font-size:0; }
  @keyframes cycle { to { background-position:133.333% 0; } }
  #mstate { font-size:11px; color:var(--dim); }
  .main { flex:1; display:grid; grid-template-columns:310px minmax(360px, 440px) 1fr; gap:14px;
          align-items:stretch; justify-content:center; min-height:0;
          height:calc(100vh - 76px); overflow:hidden; }
  .main > * { min-height:0; overflow-y:auto; }   /* each column scrolls on its own */
  @media (max-width:1100px) { .main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .roleband { font-size:10px; letter-spacing:.1em; text-transform:uppercase; border-radius:6px;
              padding:4px 8px; margin-bottom:10px; display:inline-block; }
  .role-demo { background:#3a2b12; color:var(--amber); }
  .role-product { background:#12331f; color:var(--green); }
  .role-mirror { background:#1b2a4a; color:#9db4e8; }
  .role-internal { background:#241b3d; color:var(--purple); }
  .rail-note { font-size:11px; color:var(--dim); line-height:1.6; margin:8px 2px 10px; }
  /* guided tour: retractable act cards */
  .act { border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden;
         background:#1e2638; }
  .act-head { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer;
              font-family:system-ui,"PingFang SC",sans-serif; }
  .act-num { width:26px; height:26px; border-radius:50%; background:#2a3350; color:var(--dim);
             display:flex; align-items:center; justify-content:center; font-size:13px;
             font-weight:700; flex:none; transition:background 200ms, color 200ms; }
  .act.ran .act-num { background:var(--green); color:#fff; }
  .act.open .act-num:not(.ran) { background:var(--blue); color:#fff; }
  .act-title { font-size:13.5px; font-weight:600; color:var(--ink); flex:1; }
  .act-caret { color:var(--dim); font-size:11px; transition:transform 200ms var(--ease-out); }
  .act.open .act-caret { transform:rotate(90deg); }
  .act-body { display:none; padding:0 12px 12px; font-family:system-ui,"PingFang SC",sans-serif; }
  .act.open .act-body { display:block; }
  .act-why { font-size:12px; color:#aeb9d0; line-height:1.65; }
  .act-why b { color:var(--ink); }
  .act-watch { margin-top:8px; font-size:11.5px; color:var(--dim); line-height:1.6;
               border-left:2px solid var(--line); padding-left:8px; }
  .act-chips { margin-top:8px; }
  .chip { display:inline-block; font-size:10px; border-radius:6px; padding:2px 7px; margin-right:5px;
          background:#252f4a; color:#9db4e8; }
  .act-run { margin-top:10px; width:100%; padding:10px; font-size:13px; font-weight:600;
             color:#fff; background:var(--blue); border:0; border-radius:9px; cursor:pointer;
             transition:transform 120ms var(--ease-out); font-family:inherit; }
  .act-run:active { transform:scale(0.98); }
  .act.ran .act-run { background:#2a5c40; }
  #hero { display:flex; flex-direction:column; align-items:center; }
  #phone { width:100%; max-width:400px; height:min(78vh, 800px); border:10px solid #000;
           border-radius:38px; overflow:hidden; background:#faf6ef;
           box-shadow:0 18px 60px rgba(0,0,0,.45); }
  #phone iframe { width:100%; height:100%; border:0; }
  #hero .sub { font-size:11px; color:var(--dim); margin-top:8px; text-align:center; }
  #hero .sub a { color:var(--blue); }
  /* Telegram pane — dressed as the real thing */
  .panel.tg { background:#fff; border-color:#d6dde6; padding:0; overflow:hidden; }
  .tg-head { display:flex; align-items:center; gap:10px; background:#527da3; color:#fff;
             padding:10px 14px; font-family:system-ui,sans-serif; }
  .tg-logo { width:34px; height:34px; border-radius:50%; background:#fff; display:flex;
             align-items:center; justify-content:center; flex:none; }
  .tg-name { font-size:14px; font-weight:600; line-height:1.2; }
  .tg-sub { font-size:11px; opacity:.85; }
  .tg-body { background:#e7ebf0; padding:12px; min-height:220px; max-height:46vh; overflow-y:auto; }
  .tg-note { font-size:11px; color:#7b8794; text-align:center; padding:8px;
             font-family:system-ui,sans-serif; }
  .tg-msg { display:flex; gap:8px; margin-bottom:10px; align-items:flex-end; }
  .tg-ava { width:30px; height:30px; border-radius:50%; background:#fff; flex:none;
            background-repeat:no-repeat; background-size:400% 100%; image-rendering:pixelated;
            display:flex; align-items:center; justify-content:center; font-size:18px; }
  .tg-bubble { background:#fff; color:#222; border-radius:12px 12px 12px 4px; padding:8px 12px;
               font-size:12.5px; line-height:1.5; max-width:85%; white-space:pre-wrap;
               font-family:system-ui,"PingFang SC",sans-serif;
               box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .tg-time { font-size:10px; color:#9aa6b2; text-align:right; margin-top:3px; }
  .tg-kb { margin-top:6px; }
  .tg-kb span { display:block; text-align:center; background:rgba(82,125,163,.12); color:#527da3;
                border-radius:7px; padding:6px; margin-top:4px; font-size:12px; font-weight:500; }
  details { margin-top:10px; }
  details summary { cursor:pointer; font-size:12px; color:var(--dim); padding:8px 4px;
                    border-top:1px solid var(--line); list-style:none; }
  details summary::before { content:"▸ "; } details[open] summary::before { content:"▾ "; }
  /* the skill rack: tool invocation, visible */
  #planline { font-size:11.5px; color:var(--blue); min-height:18px; margin:2px 0 6px;
              font-family:system-ui,"PingFang SC",sans-serif; }
  #rack { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .skillchip { border:1px solid var(--line); border-radius:9px; padding:5px 9px; font-size:11px;
               color:var(--dim); background:#1e2638; transition:all 250ms var(--ease-out); }
  .skillchip .cnt { color:#5f6b85; margin-left:5px; font-size:10px; }
  .skillchip.firing { border-color:var(--green); color:#fff; background:#1d3a2a;
                      box-shadow:0 0 12px rgba(53,194,110,.35); }
  .fsm { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  .state { padding:4px 8px; border-radius:7px; border:1px solid var(--line); font-size:10.5px; color:var(--dim); }
  .state.on { color:#fff; border-color:transparent; }
  .state.on.IDLE,.state.on.ENGAGED,.state.on.RESOLVED { background:var(--green); }
  .state.on.CHECKIN_SENT { background:var(--blue); }
  .state.on.SILENCE_1 { background:var(--amber); }
  .state.on.SILENCE_2,.state.on.ESCALATED { background:var(--red); }
  #log { max-height:44vh; overflow-y:auto; font-size:11.5px; line-height:1.75; }
  #log div { border-bottom:1px solid #1f2740; padding:2px 0; }
  .p-wake{color:var(--dim)} .p-think{color:var(--blue)} .p-revalidate{color:var(--purple)}
  .p-gate{color:var(--amber)} .p-act{color:#fff} .p-receipt{color:var(--green)}
  .p-commit{color:var(--dim)} .p-transition{color:var(--amber)} .p-inject{color:var(--purple)}
  .p-error{color:var(--red)} .p-liveness{color:var(--red)} .p-telegram_refused{color:var(--red)}
  .eff { color:#5f6b85; }
  .skills { font-size:11px; color:var(--dim); line-height:1.7; padding:6px 2px; }
  @media (prefers-reduced-motion: reduce) { #mascot.sprite { animation:none; } .step { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>AnAn 安安</h1>
  <span class="clock" id="clock">--:--</span>
  <span class="badge" id="uptime">—</span>
  <span class="badge" id="conn">connecting…</span>
  <button id="langbtn" onclick="toggleLang()">中文</button>
  <button id="resetbtn" style="background:#3a2222;border:1px solid #5a3030;color:#e0a0a0;border-radius:8px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer" onclick="doReset()">⟲ Reset</button>
  <div id="mascothead"><div id="mascot">🐤</div><div id="mstate">idle</div></div>
</header>
<div class="main">
  <div class="panel">
    <span class="roleband role-demo" data-i="band_demo"></span>
    <div class="rail-note" data-i="redline"></div>
    <div class="act open" id="storycard" style="background:#241f17;border-color:#4a3c22">
      <div class="act-body" style="display:block;padding:12px">
        <div class="act-why" id="storytext"></div>
      </div>
    </div>
    <div id="acts"></div>
    <details>
      <summary data-i="seeds"></summary>
      <button class="act-run" style="margin-top:8px" onclick="fetch('/seed',{method:'POST'})" data-i="seedbtn"></button>
      <div class="act-watch" style="margin-top:6px" data-i="seedx"></div>
    </details>
  </div>
  <div id="hero">
    <span class="roleband role-product" data-i="band_product"></span>
    <div id="phone"><iframe src="/elder" title="elder app live"
      allow="camera; microphone; geolocation; autoplay"></iframe></div>
    <div class="sub"><span data-i="hero_sub"></span> <a href="/elder" target="_blank">/elder ↗</a><br>
      <span data-i="hero_family"></span> <a href="/family" target="_blank">/family ↗</a></div>
  </div>
  <div>
    <div class="panel tg">
      <div class="tg-head">
        <div class="tg-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="#527da3"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></div>
        <div><div class="tg-name">安安 AnAn <span style="font-size:10px;background:rgba(255,255,255,.25);border-radius:4px;padding:1px 5px">bot</span></div>
             <div class="tg-sub" data-i="band_family"></div></div>
      </div>
      <div class="tg-body" id="family"><div class="tg-note" data-i="family_hint"></div></div>
    </div>
    <div class="panel" style="margin-top:12px; background:#171227; border-color:#2d2350">
      <span class="roleband role-internal" data-i="band_internal"></span>
      <div id="planline"><span data-i="plan_idle"></span></div>
      <div id="rack"></div>
      <div class="fsm" id="fsm"></div>
      <details open><summary data-i="log_sum"></summary><div id="log"></div></details>
      <details><summary data-i="skills_sum"></summary><div class="skills" id="skills"></div></details>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
/* ---- i18n: English first for judges; one button flips everything ---- */
const T = {
  band_demo:   ["Demo controls — NOT part of the product", "演示台 — 不属于产品"],
  redline:     ["Red line: these buttons inject <b>time</b> and ordinary inputs only — never behavior. Follow the numbers; each step says what you should see.",
                "红线: 这些按钮只注入<b>时间</b>与普通输入, 从不操纵行为。按顺序点, 每步写着应看到什么。"],
  story: ["<b>One day with 陈婆婆.</b> She is 78 and lives alone in a Toa Payoh flat — hypertension, a little forgetful, fiercely independent. Her daughter 小芸 works across the city and calls when she can. On the phone beside the kettle lives 安安 — an agent whose inputs are <b>time, silence, and state</b>.<br>What follows is one of her days, compressed. <b>Nobody will touch the agent.</b> Every act below sets the scene, then you press play and watch it happen for real — on the phone in the middle, on the daughter's Telegram, and in the agent's own receipts.",
          "<b>陈婆婆的一天。</b>78 岁, 独居大巴窑组屋 — 高血压, 有点健忘, 但要强。女儿小芸在城市另一头上班, 有空才能打电话。水壶旁的手机里住着安安 — 一个以<b>时间、沉默、状态</b>为输入的 agent。<br>下面是她被压缩的一天。<b>全程没有人碰 agent。</b>每一幕先讲场景, 你按下播放, 然后看它真实发生 — 在中间的手机上、在女儿的 Telegram 里、在 agent 自己的回执里。"],
  run: ["▶ Run this act", "▶ 运行这一幕"],
  watch: ["What to watch:", "看什么:"],
  seeds:   ["Demo seeds (fictional data, labelled as such)", "演示种子 (虚构数据, 标明为演示)"],
  seedbtn: ["Seed 6 days of history", "播种 6 天历史"],
  seedx:   ["→ Writes 6 fictional days of meds/mood/insights so the 'day 7' bulletin has a story. Demo only.",
            "→ 写入6天虚构记录, 让'第7天'的播报有据可讲。仅演示用。"],
  band_product: ["The actual app — what's installed on Grandma's phone", "产品 — 婆婆手机上安装的东西"],
  hero_sub: ["This is the live application, not a recording — interact with it directly. Install on a phone:",
             "这是真实运行的应用, 不是录像 — 可直接操作。手机安装:"],
  hero_family: ["🎙️ Family voice setup (record once, AnAn speaks in your voice — local machine only):",
                "🎙️ 家人声音设置 (录一次, 安安用您的声音说话 — 仅本机):"],
  band_family: ["Family side — the daughter's Telegram (real messages, mirrored)", "家属端 — 女儿的 Telegram (真实消息镜像)"],
  family_hint: ["Escalation alerts and nightly bulletins appear here — sent to real Telegram at the same time.",
                "升级警报和每晚播报会出现在这里 — 同时发到真实 Telegram。"],
  band_internal: ["Autonomous planning & tool invocation — every skill call receipted; the elder never sees this",
                  "自主规划与工具调用 — 每次 skill 调用皆有回执; 老人永远看不到"],
  plan_idle: ["planner: waiting for a wake…", "planner: 等待唤醒…"],
  log_sum: ["Decision log — every action: WAKE→THINK→REVALIDATE→GATE→ACT→RECEIPT→COMMIT",
            "决策日志 — 每个动作: WAKE→THINK→REVALIDATE→GATE→ACT→RECEIPT→COMMIT"],
  skills_sum: ["Skill catalogue (name + capability — the menu-first context law)",
               "Skill 目录 (name + capability — 菜单先行的上下文法则)"],
  uptime: ["autonomous for", "已自主运行"],
};
/* The seven acts — each carries its design rationale (from the convergence
   docs), what the kernel does, and what to watch on which surface. */
const ACTS = [
 {sc:'morning', scene:['7:30 AM. Sunlight through the HDB window; the kettle is quiet. 婆婆 is slow to rise today.','早上 7:30。阳光照进组屋窗户, 水壶还没响。婆婆今天起得慢。'],
  t:["Act 1 · 07:30 — the agent speaks first","第一幕 · 07:30 — 安安先开口"],
  why:["Elders don't open apps — <b>the product is proactivity</b>. The 07:30 cron is the day's first liveness probe: a greeting that is also a question. The reply window (60 min, family-configured) arms silently.",
       "老人不会主动打开 App — <b>主动性就是产品</b>。07:30 的定时问候是全天第一个存活探测: 一句问候, 同时是一次提问。60 分钟回应窗口 (家属可配) 悄悄布下。"],
  watch:["~15s: the phone pops a bilingual card and speaks (live model compose). Trace: wake→think→gate→act→receipt, state → CHECKIN_SENT.",
         "约15秒: 手机弹出双语卡并朗读 (模型实时生成)。日志: wake→think→gate→act→receipt, 状态 → CHECKIN_SENT。"],
  chips:['⚙ greet_checkin','📱 phone','🧠 trace']},
 {sc:'silence_1', scene:['8:31 AM. The greeting sits unanswered on the table. The flat is silent — and to AnAn, silence is not nothing.','8:31。问候卡在桌上没人应。屋里很静 — 对安安来说, 沉默不是空白。'],
  t:["Act 2 · +61 min — silence becomes data","第二幕 · +61分钟 — 沉默变成数据"],
  why:["<b>\"Silence is an input.\"</b> Chatbots' input domain is {text}; AnAn's is {time, silence, state}. The window expires and the agent reaches a JUNCTION: retry another channel, escalate now, or extend once. The model chooses inside a bounded envelope — the deterministic floor stands if it fails.",
       "<b>\"沉默是输入。\"</b> 聊天机器人的输入域是{文字}; 安安的是{时间、沉默、状态}。窗口到期, agent 走到决策节点: 换渠道重试 / 立即升级 / 再等一次。模型在受限选项内选择 — 模型失效时确定性兜底照常执行。"],
  watch:["Trace: junction receipt shows options + chosen + how (model/floor). State walks SILENCE_1 → retry on voice channel.",
         "日志: junction 回执显示选项/所选/方式 (model/floor)。状态走到 SILENCE_1 → 语音渠道重试。"],
  chips:['⚙ greet_checkin (retry)','🧠 trace']},
 {sc:'silence_2', scene:['9:02 AM. Still nothing. Across the city, 小芸 is in a meeting, phone face-down.','9:02。还是没有回应。城市另一头, 小芸在开会, 手机扣在桌上。'],
  t:["Act 3 · +31 min — the escalation promise","第三幕 · +31分钟 — 升级承诺"],
  why:["Channels exhausted means <b>a person may be in trouble</b> — this is the moment the whole product exists for. The agent notifies the daughter's REAL Telegram with action buttons; the button callback, not a spoken promise, is what closes the loop.",
       "渠道用尽 = <b>人可能出事了</b> — 整个产品为这一刻而存在。agent 通知女儿的真实 Telegram, 带操作按钮; 闭环靠按钮回调, 不靠口头承诺。"],
  watch:["The mirror (and the real phone) gets the alert card. State: SILENCE_2 → ESCALATED, callback window armed. Mascot flies.",
         "右侧镜像 (和真手机) 收到警报卡。状态: SILENCE_2 → ESCALATED, 回电窗口布下。吉祥物起飞。"],
  chips:['⚙ escalate_tree','✈️ telegram','📱 phone','🧠 trace']},
 {sc:'escalation_timeout', scene:["9:13 AM. The alert glows unread on 小芸's phone. A tree that stops at one branch isn't a tree.",'9:13。警报在小芸手机上亮着, 没人看。只停在一根枝上的, 不叫树。'],
  t:["Act 4 · +11 min — the tree actually walks","第四幕 · +11分钟 — 联系人树真的会走"],
  why:["A contact 'tree' that stops at one person is a lie. No callback within the window → the NEXT contact is notified (daughter → son → neighbour), each hop with its own idempotent receipt — double-taps can never double-process.",
       "只停在第一个人的'树'是假的。窗口内无回电 → 通知下一位 (女儿→儿子→邻居), 每一跳有独立幂等回执 — 重复点按不会重复处理。"],
  watch:["Trace: escalation_timeout junction → next_contact receipt with a fresh esc-id. ESCALATED re-arms.",
         "日志: escalation_timeout 节点 → next_contact 回执, 新 esc-id。ESCALATED 重新布防。"],
  chips:['⚙ escalate_tree ×next','✈️ telegram','🧠 trace']},
 {sc:'recover', scene:['Then — slippers shuffle at the door. 婆婆 was watering plants along the corridor the whole time.','然后 — 门口传来拖鞋声。婆婆一直在走廊浇花呢。'],
  t:["Act 5 · a single touch — the 反悔 beat","第五幕 · 碰一下屏幕 — 反悔镜头"],
  why:["<b>Every touch is a heartbeat</b> — med button, a word, any tap. It dissolves the entire silence net instantly. And if an escalation decision is mid-flight, REVALIDATE kills it before any external action: a decision born from an old snapshot must re-check the world (stale-decision revalidation).",
       "<b>每次触碰都是心跳</b> — 按用药键、说一句话、随手一点, 都会立即消解整张沉默网。若升级决策还在途中, REVALIDATE 会在任何外部动作前取消它: 旧快照生出的决策必须先重看世界 (陈旧决策再验证)。"],
  watch:["State snaps to ENGAGED (or RESOLVED if escalated). If a junction races: 'revalidate → STALE, candidate cancelled'.",
         "状态跳到 ENGAGED (升级中则 RESOLVED)。若与节点赛跑: 'revalidate → STALE, 候选取消'。"],
  chips:['⚙ kernel revalidate','📱 phone','🧠 trace']},

function renderActs(){
  const idx = lang==='en'?0:1;
  const box = document.getElementById('acts'); box.innerHTML='';
  ACTS.forEach((a,i)=>{
    const d=document.createElement('div');
    d.className='act'+(a.ran?' ran':'')+(a.open?' open':'');
    d.innerHTML=`
      <div class="act-head" onclick="toggleAct(${i})">
        <div class="act-num">${a.ran?'✓':i+1}</div>
        <div class="act-title">${a.t[idx]}</div>
        <div class="act-caret">▶</div>
      </div>
      <div class="act-body">
        ${a.scene?`<div class="act-why" style="font-style:italic;color:#d8c9a3;margin-bottom:6px">${a.scene[idx]}</div>`:''}
        <div class="act-why">${a.why[idx]}</div>
        <div class="act-watch"><b>${T.watch[idx]}</b> ${a.watch[idx]}</div>
        <div class="act-chips">${a.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
        <button class="act-run" onclick="runAct(${i});event.stopPropagation()">${T.run[idx]}</button>
      </div>`;
    box.appendChild(d);
  });
}
function toggleAct(i){ ACTS[i].open=!ACTS[i].open; renderActs(); }
function runAct(i){ sc(ACTS[i].sc); ACTS[i].ran=true; ACTS[i].open=false;
  if(ACTS[i+1]) ACTS[i+1].open=true; renderActs(); }
ACTS[0].open=true;

let lang = localStorage.getItem('anan_lang') || 'en';
function applyLang(){
  const idx = lang==='en' ? 0 : 1;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.innerHTML = T[el.dataset.i][idx]; });
  $('langbtn').textContent = lang==='en' ? '中文' : 'EN';
  document.documentElement.lang = lang;
  renderActs();
  const st=document.getElementById('storytext'); if(st) st.innerHTML=T.story[idx];
}
function toggleLang(){ lang = lang==='en'?'zh':'en'; localStorage.setItem('anan_lang', lang); applyLang(); refresh(lastState); }
applyLang();

const STATES=['IDLE','CHECKIN_SENT','ENGAGED','SILENCE_1','SILENCE_2','ESCALATED','RESOLVED'];
const fsmEl=$('fsm');
STATES.forEach(s=>{const d=document.createElement('div');d.className='state '+s;d.id='st-'+s;d.textContent=s;fsmEl.appendChild(d);});
function setState(s){STATES.forEach(x=>$('st-'+x).classList.toggle('on',x===s));}
function sc(name){fetch('/inject/scenario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});}
function doReset(){ ACTS.forEach(a=>{a.ran=false;a.open=false;}); ACTS[0].open=true;
  fetch('/reset',{method:'POST'}); }
const M_EMOJI={idle:'🐤',sleep:'😴',alert:'🚨',think:'🤔',talk:'💬',work:'🛠️',fly:'🕊️',happy:'😊',listen:'👂',dizzy:'😵‍💫'};
const sprites={};
Object.keys(M_EMOJI).forEach(s=>{ const img=new Image();
  img.onload=()=>{ sprites[s]=img.src; if(lastState) refresh(lastState); };  // re-render once loaded
  img.src=`/mascot/${s}-atlas.png`; });
let mhold=0;
function mascot(s,holdMs=0){
  const now=Date.now();
  if(now<mhold && s!=='alert' && s!=='fly') return;
  mhold=holdMs?now+holdMs:0;
  const el=$('mascot');
  // per-frame ms × 4 frames = cycle (codex-approved: alert 320ms/f, happy 280ms/f)
  const SPEED={idle:'1.28s',sleep:'1.8s',fly:'.8s',alert:'1.28s',talk:'.88s',work:'1s',happy:'1.12s',listen:'1s',dizzy:'1s',think:'1.4s'};
  if(sprites[s]){ el.classList.add('sprite'); el.style.backgroundImage=`url(${sprites[s]})`;
    el.style.setProperty('--bspeed', SPEED[s]||'.55s'); el.textContent=''; }
  else { el.classList.remove('sprite'); el.style.backgroundImage=''; el.textContent=M_EMOJI[s]||'🐤'; }
  $('mstate').textContent=s;
}
const FSM_M={IDLE:'idle',CHECKIN_SENT:'talk',ENGAGED:'happy',SILENCE_1:'think',SILENCE_2:'alert',ESCALATED:'fly',RESOLVED:'happy'};
function mascotFromEvent(ev){
  if(ev.kind==='error') return mascot('dizzy',2500);
  if(ev.kind==='think') return mascot('think',1200);
  if(ev.kind==='act') return mascot('work',1500);
}
const log=$('log');
function addEvent(e){
  const d=document.createElement('div'); d.className='p-'+e.kind;
  const det=e.detail||{}; const bits=[];
  if(e.kind==='think'&&det.junction) bits.push(`junction=${det.junction} chose=${det.chosen} (${det.how||''})`);
  else if(e.kind==='think') bits.push(`skill=${det.skill||''} ${det.reason||''}`);
  else if(e.kind==='revalidate') bits.push(`${det.junction||det.skill||''} → ${det.verdict}${det.why?' · '+det.why:''}`);
  else if(e.kind==='gate') bits.push(`${det.skill} [${(det.effects||[]).join(',')}] → ${det.verdict}`);
  else if(e.kind==='receipt') bits.push(`${(det.text||det.insight||det.reply||'').slice(0,70)}${det.lane?' · '+det.lane:''}`);
  else if(e.kind==='wake'&&det.crons) bits.push(`boot: ${det.crons.length} stale crons → rolled forward, none replayed`);
  else if(e.kind==='wake'&&det.event) bits.push(`${det.event}${det.skill?' · '+det.skill:''}${det.text?' · '+String(det.text).slice(0,50):''}`);
  else bits.push(JSON.stringify(det).slice(0,90));
  d.innerHTML=`[${e.at.slice(11)}] <b>${e.kind}</b> ${e.source} ${bits.join(' ')}`+(e.effect?` <span class="eff">⇒ ${e.effect}</span>`:'');
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  while(log.children.length>300) log.firstChild.remove();
  mascotFromEvent(e);
  rackFromEvent(e);
}
/* skill rack: light up the invoked tool; narrate the planner's choices */
const rackCounts={};
function rackFromEvent(e){
  const det=e.detail||{};
  if(e.kind==='act'){
    rackCounts[e.source]=(rackCounts[e.source]||0)+1;
    renderRack(e.source);
    setTimeout(()=>renderRack(), 2200);
  }
  if(e.kind==='think'&&(det.junction||det.chosen)){
    const how=det.how||''; const chosen=det.chosen||det.skill||'';
    if(chosen) $('planline').textContent=`planner @${e.at.slice(11)}: ${det.junction||'wake'} → ${chosen}${how?` (${how})`:''}`;
  }
  if(e.kind==='receipt'&&e.source==='care_insight'&&det.insight){
    $('planline').textContent=`🧬 memory += ${det.insight.slice(0,110)}`;
  }
}
let rackSkills=[];
function renderRack(firing){
  $('rack').innerHTML = rackSkills.map(s=>
    `<span class="skillchip${s.id===firing?' firing':''}">⚙ ${s.id}<span class="cnt">×${rackCounts[s.id]||0}</span></span>`).join('');
}
function addFamily(c){
  const el=document.createElement('div'); el.className='tg-msg';
  const ava = sprites['idle'] ? `style="background-image:url(${sprites['idle']})"` : '';
  el.innerHTML=`<div class="tg-ava" ${ava}>${sprites['idle']?'':'🐤'}</div>
    <div class="tg-bubble">${c.text}
      ${c.buttons?`<div class="tg-kb"><span>✅ 我已回电 Called back</span><span>🏠 联系邻居 Contact neighbour</span></div>`:''}
      <div class="tg-time">${c.at} · ${c.delivered||''}</div>
    </div>`;
  const box=$('family'); box.appendChild(el); box.scrollTop=box.scrollHeight;
  while(box.children.length>7) box.firstChild.remove();
}
let lastState=null;
const es=new EventSource('/events');
es.onopen=()=>$('conn').textContent='● live';
es.onerror=()=>$('conn').textContent='○ reconnecting…';
es.onmessage=m=>{
  const d=JSON.parse(m.data);
  if(d.kind==='hello'){ (d.history||[]).forEach(addEvent); mhold=0; refresh(d.state); }
  if(d.kind==='reset'){ location.reload(); }
  if(d.kind==='event'){ addEvent(d.event); refresh(d.state); }
  if(d.kind==='family_card') addFamily(d);
};
function refresh(s){
  if(!s) return; lastState=s;
  $('clock').textContent=s.time.slice(11,16);
  $('uptime').textContent=`${T.uptime[lang==='en'?0:1]} ${s.uptime_h}h`;
  setState(s.fsm.state);
  const hour=parseInt(s.time.slice(11,13),10);
  mascot(s.fsm.state==='IDLE'&&(hour>=22||hour<7)?'sleep':(FSM_M[s.fsm.state]||'idle'));
  $('skills').innerHTML=s.skills.map(x=>`- <b>${x.id}</b>: ${x.capability}`).join('<br>');
  if(rackSkills.length!==s.skills.length){ rackSkills=s.skills; renderRack(); }
}
