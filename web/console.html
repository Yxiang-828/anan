<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安安 · 演示台</title>
<style>
  :root { --bg:#10141f; --panel:#1a2030; --ink:#dfe6f3; --dim:#7d8aa5; --line:#2a3350;
          --blue:#4f7cff; --green:#35c26e; --amber:#f0a53c; --red:#ef5350; --purple:#9b7ef0;
          --ease-out:cubic-bezier(0.23,1,0.32,1); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"JetBrains Mono","PingFang SC",monospace;
         padding:16px; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; }
  .clock { font-size:26px; font-weight:700; color:#fff; background:#000; border-radius:8px; padding:2px 12px; }
  .badge { font-size:12px; color:var(--dim); }
  .redline { font-size:11px; color:var(--dim); margin-left:auto; max-width:420px; text-align:right; }
  .grid { flex:1; display:grid; grid-template-columns:250px 1fr 300px; gap:12px; min-height:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px;
           display:flex; flex-direction:column; min-height:0; }
  .panel h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.12em; margin-bottom:8px; }
  button { background:#232c44; color:var(--ink); border:1px solid var(--line); border-radius:8px;
           padding:8px 10px; margin:0 5px 7px 0; font:inherit; font-size:12px; cursor:pointer;
           transition:transform 120ms var(--ease-out), border-color 120ms; }
  button:hover { border-color:var(--blue); } button:active { transform:scale(0.96); }

  /* mascot stage — codex sprite contract: web/mascot/<state>-atlas.png, 4x 256px cells */
  #stage { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 0 6px; }
  #mascot { width:160px; height:160px; image-rendering:auto; background-repeat:no-repeat;
            background-size:400% 100%; display:flex; align-items:center; justify-content:center;
            font-size:84px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
  #mascot.sprite { animation:cycle .9s steps(4) infinite; font-size:0; }
  @keyframes cycle { to { background-position:-400% 0; } }
  #mstate { font-size:12px; color:var(--dim); }
  .fsm { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
  .state { padding:5px 9px; border-radius:8px; border:1px solid var(--line); font-size:11px; color:var(--dim); }
  .state.on { color:#fff; border-color:transparent; }
  .state.on.IDLE,.state.on.ENGAGED,.state.on.RESOLVED { background:var(--green); }
  .state.on.CHECKIN_SENT { background:var(--blue); }
  .state.on.SILENCE_1 { background:var(--amber); }
  .state.on.SILENCE_2,.state.on.ESCALATED { background:var(--red); }

  #log { flex:1; overflow-y:auto; font-size:11.5px; line-height:1.75; min-height:0; }
  #log div { border-bottom:1px solid #1f2740; padding:2px 0; }
  .p-wake{color:var(--dim)} .p-think{color:var(--blue)} .p-revalidate{color:var(--purple)}
  .p-gate{color:var(--amber)} .p-act{color:#fff} .p-receipt{color:var(--green)}
  .p-commit{color:var(--dim)} .p-transition{color:var(--amber)} .p-inject{color:var(--purple)}
  .p-error{color:var(--red)} .p-liveness{color:var(--red)} .p-heartbeat{color:var(--green)}
  .p-telegram_refused{color:var(--red)}
  .eff { color:#5f6b85; }
  .mirror { flex:1; overflow-y:auto; min-height:0; }
  .mirror .card { background:#212b45; border-radius:10px; padding:10px; margin-bottom:8px;
                  font-size:12px; white-space:pre-wrap; opacity:1; transition:opacity 250ms var(--ease-out); }
  @starting-style { .mirror .card { opacity:0; } }
  .mirror .card b { color:var(--amber); display:block; margin-bottom:4px; }
  .tgbtn { display:inline-block; background:#2b3a5e; border-radius:6px; padding:4px 10px;
           margin:6px 6px 0 0; font-size:11px; color:#9db4e8; }
  .skills { font-size:11px; color:var(--dim); line-height:1.7; overflow-y:auto; }
  @media (prefers-reduced-motion: reduce) { #mascot.sprite { animation:none; } button { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>安安 · 演示台</h1>
  <span class="clock" id="clock">--:--</span>
  <span class="badge" id="uptime">已自主运行 —</span>
  <span class="badge" id="conn">connecting…</span>
  <span class="redline">红线: 只注入时间与场景, 不操纵行为。<br>"We inject time, never behavior."</span>
</header>
<div class="grid">
  <div class="panel">
    <h2>Agent</h2>
    <div id="stage"><div id="mascot">🐤</div><div id="mstate">idle</div></div>
    <h2 style="margin-top:10px">⏱ 时间与场景注入</h2>
    <div>
      <button onclick="sc('morning')">跳到 07:30 晨候</button>
      <button onclick="sc('silence_1')">+61min 无回应</button>
      <button onclick="sc('silence_2')">+31min 仍无回应</button>
      <button onclick="sc('escalation_timeout')">+11min 家人未回</button>
      <button onclick="sc('recover')">婆婆回应了</button>
      <button onclick="sc('evening')">跳到 20:00 播报</button>
      <button onclick="sc('insight')">跳到 21:00 洞察</button>
      <button onclick="fetch('/seed',{method:'POST'})">播种 6 天历史</button>
    </div>
    <h2 style="margin-top:8px">🧩 Skills (menu = name + capability)</h2>
    <div class="skills" id="skills"></div>
  </div>
  <div class="panel">
    <h2>WAKE → THINK → REVALIDATE → GATE → ACT → RECEIPT → COMMIT</h2>
    <div class="fsm" id="fsm"></div>
    <div id="log"></div>
  </div>
  <div class="panel">
    <h2>📱 女儿的手机 (Telegram 镜像)</h2>
    <div class="mirror" id="family"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const STATES=['IDLE','CHECKIN_SENT','ENGAGED','SILENCE_1','SILENCE_2','ESCALATED','RESOLVED'];
const fsmEl=$('fsm');
STATES.forEach(s=>{const d=document.createElement('div');d.className='state '+s;d.id='st-'+s;d.textContent=s;fsmEl.appendChild(d);});
function setState(s){STATES.forEach(x=>$('st-'+x).classList.toggle('on',x===s));}
function sc(name){fetch('/inject/scenario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});}

/* ---- mascot: sprite if codex atlas exists, emoji until then ---- */
const M_EMOJI={idle:'🐤',sleep:'😴',alert:'🚨',think:'🤔',talk:'💬',work:'🛠️',fly:'🕊️',happy:'😊',listen:'👂',dizzy:'😵‍💫'};
const sprites={};
Object.keys(M_EMOJI).forEach(s=>{
  const img=new Image();
  img.onload=()=>sprites[s]=img.src;
  img.src=`/mascot/${s}-atlas.png`;
});
let mstate='idle', mhold=0;
function mascot(s,holdMs=0){
  const now=Date.now();
  if(now<mhold && s!=='alert' && s!=='fly') return;   // don't stomp a held beat
  mstate=s; mhold=holdMs?now+holdMs:0;
  const el=$('mascot');
  if(sprites[s]){ el.classList.add('sprite'); el.style.backgroundImage=`url(${sprites[s]})`; el.textContent=''; }
  else { el.classList.remove('sprite'); el.style.backgroundImage=''; el.textContent=M_EMOJI[s]||'🐤'; }
  $('mstate').textContent=s;
}
const FSM_M={IDLE:'idle',CHECKIN_SENT:'talk',ENGAGED:'happy',SILENCE_1:'think',SILENCE_2:'alert',ESCALATED:'fly',RESOLVED:'happy'};
function mascotFromEvent(ev){
  if(ev.kind==='error') return mascot('dizzy',2500);
  if(ev.kind==='think') return mascot('think',1200);
  if(ev.kind==='act') return mascot('work',1500);
  if(ev.kind==='heartbeat'||ev.kind==='wake'&&ev.detail?.event==='heartbeat') return mascot('happy',1500);
}

/* ---- trace ---- */
const log=$('log');
function addEvent(e){
  const d=document.createElement('div'); d.className='p-'+e.kind;
  const bits=[];
  const det=e.detail||{};
  if(e.kind==='think'&&det.junction) bits.push(`junction=${det.junction} chose=${det.chosen} (${det.how||''})`);
  else if(e.kind==='think') bits.push(`skill=${det.skill||''} ${det.reason||''}`);
  else if(e.kind==='revalidate') bits.push(`${det.junction||det.skill||''} → ${det.verdict}${det.why?' · '+det.why:''}`);
  else if(e.kind==='gate') bits.push(`${det.skill} [${(det.effects||[]).join(',')}] → ${det.verdict}`);
  else if(e.kind==='receipt') bits.push(`${(det.text||det.insight||det.reply||'').slice(0,70)}${det.lane?' · '+det.lane:''}`);
  else bits.push(JSON.stringify(det).slice(0,90));
  d.innerHTML=`[${e.at.slice(11)}] <b>${e.kind}</b> ${e.source} ${bits.join(' ')}`+(e.effect?` <span class="eff">⇒ ${e.effect}</span>`:'');
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  while(log.children.length>300) log.firstChild.remove();
  mascotFromEvent(e);
}
function addFamily(c){
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<b>${c.at} · ${c.delivered||''}</b>`+c.text+
    (c.buttons?`<br><span class="tgbtn">✅ 我已回电 Called back</span><span class="tgbtn">🏠 联系邻居</span>`:'');
  const box=$('family'); box.prepend(el);
  while(box.children.length>6) box.lastChild.remove();
}
const es=new EventSource('/events');
es.onopen=()=>$('conn').textContent='● live';
es.onerror=()=>$('conn').textContent='○ reconnecting…';
es.onmessage=m=>{
  const d=JSON.parse(m.data);
  if(d.kind==='hello'){ (d.history||[]).forEach(addEvent); mhold=0; refresh(d.state); }
  if(d.kind==='event'){ addEvent(d.event); refresh(d.state); }
  if(d.kind==='family_card') addFamily(d);
};
function refresh(s){
  if(!s) return;
  $('clock').textContent=s.time.slice(11,16);
  $('uptime').textContent=`已自主运行 ${s.uptime_h}h`;
  setState(s.fsm.state);
  const hour=parseInt(s.time.slice(11,13),10);
  const base=FSM_M[s.fsm.state]||'idle';
  mascot(s.fsm.state==='IDLE'&&(hour>=22||hour<7)?'sleep':base);
  $('skills').innerHTML=s.skills.map(x=>`- <b>${x.id}</b>: ${x.capability}`).join('<br>');
}
</script>
</body>
</html>
