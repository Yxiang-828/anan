<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<link rel="manifest" href="/manifest.json">
<title>安安 AnAn</title>
<style>
  /* ---- tokens (craft-frontend §3: named, not a palette dump) ---- */
  :root {
    --warm:#faf6ef; --ink:#2b2620; --muted:#8a8175; --card:#ffffff;
    --green:#2e9e5b; --blue:#3b6fe0; --red:#e04a3b; --amber:#e8a13c;
    --shadow:0 2px 12px rgba(60,40,10,.08);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:#e9e2d5; font-family:"PingFang SC","Noto Sans SC",sans-serif; color:var(--ink); }

  /* ---- phone frame: desktop judges see a phone; a phone sees the app ---- */
  #frame { height:100%; display:flex; align-items:center; justify-content:center; }
  #device { position:relative; width:100%; height:100%; background:var(--warm);
            display:flex; flex-direction:column; overflow:hidden; }
  @media (min-width:520px) {
    #device { width:390px; height:min(800px, 94vh); border-radius:44px;
              border:10px solid #1a1a1a; box-shadow:0 18px 60px rgba(0,0,0,.35); }
    #device::before { content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%);
                      width:110px; height:24px; background:#1a1a1a; border-radius:12px; z-index:50; }
  }

  /* ---- status bar ---- */
  #bar { display:flex; justify-content:space-between; align-items:center;
         padding:34px 20px 6px; font-size:14px; color:var(--muted); }
  #beat { width:10px; height:10px; border-radius:50%; background:var(--green);
          transition:transform 300ms var(--ease-out); }
  #beat.pulse { transform:scale(1.6); }

  /* ---- screens ---- */
  #screens { flex:1; overflow-y:auto; padding:6px 16px 96px; }
  .screen { display:none; }
  .screen.on { display:block; }
  h1 { font-size:26px; margin:8px 2px 14px; }
  h1 small { display:block; font-size:14px; color:var(--muted); font-weight:400; margin-top:2px; }

  .card { background:var(--card); border-radius:22px; padding:20px; margin-bottom:12px;
          box-shadow:var(--shadow); opacity:1; transform:translateY(0);
          transition:opacity 250ms var(--ease-out), transform 250ms var(--ease-out); }
  @starting-style { .card { opacity:0; transform:translateY(8px); } }
  .tag { display:inline-block; font-size:13px; color:#fff; border-radius:999px; padding:3px 12px; margin-bottom:10px; }
  .tag.greet { background:var(--blue); } .tag.med { background:var(--amber); }
  .tag.chat { background:var(--green); } .tag.alert { background:var(--red); }
  .zh { font-size:22px; line-height:1.5; }
  .en { font-size:15px; line-height:1.45; color:var(--muted); margin-top:6px; }

  .actions { display:flex; gap:10px; margin-top:14px; }
  button { font-family:inherit; border:0; cursor:pointer; }
  .btn { flex:1; border-radius:16px; padding:14px 8px; font-size:20px; color:#fff;
         transition:transform 140ms var(--ease-out); }
  .btn:active { transform:scale(0.96); }
  .btn small { display:block; font-size:13px; opacity:.85; }
  .ok { background:var(--green); } .later { background:#cfc6b8; color:#5c554b; }

  /* talk screen */
  #talkpad { display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:30px; }
  #holdbtn { width:170px; height:170px; border-radius:50%; background:var(--green); color:#fff;
             font-size:22px; box-shadow:var(--shadow); transition:transform 160ms var(--ease-out), background 200ms; }
  #holdbtn:active, #holdbtn.listening { transform:scale(0.95); background:#237a46; }
  #caption { min-height:80px; text-align:center; padding:0 18px; }

  /* log screen */
  .logrow { display:flex; gap:10px; align-items:flex-start; background:var(--card);
            border-radius:14px; padding:14px; margin-bottom:8px; box-shadow:var(--shadow); }
  .logdot { width:10px; height:10px; border-radius:50%; margin-top:7px; flex:none; }
  .logrow .zh { font-size:17px; } .logrow .en { font-size:13px; margin-top:2px; }

  /* sos screen */
  #sosbtn { width:100%; border-radius:22px; background:var(--red); color:#fff;
            font-size:30px; font-weight:700; padding:26px; margin-bottom:14px;
            transition:transform 140ms var(--ease-out); }
  #sosbtn:active { transform:scale(0.97); }
  #sosbtn small { display:block; font-size:15px; font-weight:400; margin-top:4px; opacity:.9; }
  .contact { display:flex; align-items:center; gap:14px; background:var(--card); border-radius:18px;
             padding:16px; margin-bottom:10px; box-shadow:var(--shadow); }
  .avatar { width:52px; height:52px; border-radius:50%; background:#f3d9db; display:flex;
            align-items:center; justify-content:center; font-size:24px; flex:none; }
  .contact .who { flex:1; } .contact .who .zh { font-size:19px; } .contact .who .en { font-size:13px; }
  .call { background:var(--green); color:#fff; border-radius:14px; padding:12px 18px; font-size:17px;
          transition:transform 140ms var(--ease-out); }
  .call:active { transform:scale(0.95); }

  /* ---- tab bar: the only chrome; huge targets ---- */
  #tabs { position:absolute; bottom:0; left:0; right:0; display:flex;
          background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
          border-top:1px solid #eee5d6; padding:6px 6px calc(10px + env(safe-area-inset-bottom)); }
  .tab { flex:1; background:none; padding:8px 2px; text-align:center; color:var(--muted);
         font-size:13px; border-radius:14px; transition:transform 140ms var(--ease-out); }
  .tab:active { transform:scale(0.94); }
  .tab .ico { font-size:26px; display:block; }
  .tab.on { color:var(--ink); background:var(--warm); }

  @media (prefers-reduced-motion: reduce) {
    .card, .btn, .tab, #holdbtn, .call, #sosbtn, #beat { transition:opacity 200ms ease; transform:none !important; }
  }
</style>
</head>
<body>
<div id="frame"><div id="device">
  <div id="bar"><span id="clock">--:--</span><span style="display:flex;gap:8px;align-items:center">
    <span id="agentname" style="color:var(--muted)">安安</span><span id="beat"></span></span></div>
  <div id="screens">

    <section class="screen on" id="s-home">
      <h1 id="hello">您好 ☁️<small id="hello-en">Good day</small></h1>
      <div id="feed"></div>
    </section>

    <section class="screen" id="s-talk">
      <h1>跟安安说话<small>Talk with AnAn</small></h1>
      <div id="talkpad">
        <button id="holdbtn">🎙️<br>按住说话<br><small style="font-size:14px">Hold to talk</small></button>
        <div id="caption"><p class="zh" id="cap-zh">按住绿色按钮, 像打电话一样和我聊。</p>
          <p class="en" id="cap-en">Press and hold the green button and talk to me like a phone call.</p></div>
      </div>
    </section>

    <section class="screen" id="s-log">
      <h1>它帮我做的事<small>What AnAn did for me</small></h1>
      <div id="loglist"></div>
    </section>

    <section class="screen" id="s-sos">
      <h1>需要帮忙?<small>Need help?</small></h1>
      <button id="sosbtn" onclick="sos()">SOS 紧急求助<small>Emergency — alert my family now</small></button>
      <div id="contacts"></div>
    </section>

  </div>
  <nav id="tabs">
    <button class="tab on" data-s="home"><span class="ico">🏠</span>今天 Today</button>
    <button class="tab" data-s="talk"><span class="ico">🎙️</span>说话 Talk</button>
    <button class="tab" data-s="log"><span class="ico">📖</span>记录 Log</button>
    <button class="tab" data-s="sos"><span class="ico">❤️</span>家人 Family</button>
  </nav>
</div></div>

<script>
const $ = id => document.getElementById(id);
const tagFor = { greeting:['greet','安安 · 主动问候 Check-in'], med:['med','用药提醒 Medication'],
                 chat:['chat','安安'], escalate_fallback:['alert','安安 · 紧急 Emergency'] };

/* every card text is bilingual by contract: zh line(s) then en line(s) */
function splitBilingual(text){
  const lines = (text||'').split('\n').filter(Boolean);
  const zh = lines.filter(l=>/[一-鿿]/.test(l)).join(' ');
  const en = lines.filter(l=>!/[一-鿿]/.test(l)).join(' ');
  return { zh: zh||text, en };
}
/* voice: server-side qwen3-TTS first; browser only with a REAL zh voice; else silent */
let audioEl=null;
async function speak(text){
  if(!text) return;
  try{
    const r=await fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, lang: state.lang})});
    const d=await r.json();
    if(d.url){ if(audioEl){audioEl.pause();} audioEl=new Audio(d.url); audioEl.play(); return; }
  }catch(e){}
  try{
    const voices=speechSynthesis.getVoices();
    const zh=voices.find(v=>/zh|cmn|Chinese/i.test(v.lang+v.name));
    if(state.lang==='zh' && !zh) return;      // no real Chinese voice → silence beats garble
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; if(zh) u.voice=zh; u.rate=.92;
    speechSynthesis.speak(u);
  }catch(e){}
}
function beat(){ const b=$('beat'); b.classList.add('pulse'); setTimeout(()=>b.classList.remove('pulse'), 320); }

function addCard(c){
  const [cls,label] = tagFor[c.type]||['chat','安安'];
  const {zh,en} = splitBilingual(c.text);
  const el = document.createElement('div'); el.className='card';
  let actions='';
  if(c.type==='med') actions = `<div class="actions">
     <button class="btn ok" onclick="med(this)">✓ 我吃了<small>Taken</small></button>
     <button class="btn later" onclick="medLater(this)">等会儿<small>Later</small></button></div>`;
  el.innerHTML = `<span class="tag ${cls}">${label} · ${c.at||''}</span>
     <p class="zh">${zh}</p>${en?`<p class="en">${en}</p>`:''}${actions}`;
  const feed=$('feed'); feed.prepend(el);
  while(feed.children.length>5) feed.lastChild.remove();
  if(c.speak){ const utter = state.lang==='en'&&en ? en : zh; speak(utter); }
}
function med(btn){ btn.textContent='✓ 已记录 Recorded'; btn.disabled=true; beat();
  fetch('/elder/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({via:'med_button',med:state.med})}); }
function medLater(btn){ btn.textContent='好, 等会儿再提醒 OK, later'; btn.disabled=true; beat();
  // a postponement is still a TOUCH — liveness signal without a med-taken log
  fetch('/elder/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({via:'med_later'})}); }
function sos(){ beat(); fetch('/elder/sos',{method:'POST'}); speak('已经通知家人了, 您别急。'); }

/* tabs (+ ?s=talk|log|sos deep links — a reload must land on the same screen) */
function show(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.s===name));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id==='s-'+name));
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.s)));
const deep=new URLSearchParams(location.search).get('s');
if(deep) show(deep);

/* hold-to-talk */
let rec=null;
try{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){ rec=new SR(); rec.lang='zh-CN'; rec.onresult=e=>say(e.results[0][0].transcript); } }catch(e){}
const hold=$('holdbtn');
hold.addEventListener('pointerdown',()=>{ hold.classList.add('listening'); beat();
  if(rec){ try{rec.start()}catch(e){} } });
hold.addEventListener('pointerup',()=>{ hold.classList.remove('listening');
  if(rec){ try{rec.stop()}catch(e){} } else { const t=prompt('说点什么? Say something:'); say(t); } });
function say(text){ if(!text) return; beat();
  $('cap-zh').textContent='您: '+text; $('cap-en').textContent='';
  fetch('/elder/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}); }

/* transparency log — receipts rendered as plain speech */
const LOGLABEL = {
  greet_checkin:  ['跟我问了早安','said good morning to me','var(--blue)'],
  med_reminder:   ['提醒我吃药','reminded me about my medicine','var(--amber)'],
  companion_chat: ['陪我聊了天','kept me company','var(--green)'],
  escalate_tree:  ['联系了我的家人','reached out to my family','var(--red)'],
  family_bulletin:['把我的情况告诉了家里人','updated my family about my day','var(--blue)'],
  care_insight:   ['记下了对我健康有用的观察','noted something useful about my health','var(--green)'],
};
function addLog(ev){
  if(ev.kind!=='receipt' || !LOGLABEL[ev.source]) return;
  const [zh,en,color]=LOGLABEL[ev.source];
  const el=document.createElement('div'); el.className='logrow';
  el.innerHTML=`<span class="logdot" style="background:${color}"></span>
    <div><p class="zh">${ev.at.slice(11,16)} 安安${zh}</p><p class="en">AnAn ${en}</p></div>`;
  const l=$('loglist'); l.prepend(el);
  while(l.children.length>20) l.lastChild.remove();
}

/* contacts from config via /state */
function renderContacts(tree){
  $('contacts').innerHTML=(tree||[]).map((c,i)=>{
    const canCall = !!c.phone;
    return `
    <div class="contact"><div class="avatar">${['👧','👦','🏠'][i]||'👤'}</div>
      <div class="who"><p class="zh">${c.name}</p><p class="en">${c.relation}</p></div>
      ${canCall
        ? `<a class="call" style="text-decoration:none" href="tel:${c.phone}" onclick="beat()">📞 呼叫 Call</a>`
        : `<button class="call" style="opacity:.45" disabled>📞 未配置<br><small>no number</small></button>`}
    </div>`;}).join('');
}

const state={lang:'zh', med:''};
const es=new EventSource('/events');
es.onmessage=m=>{
  const d=JSON.parse(m.data);
  if(d.kind==='hello'){
    (d.elder_feed||[]).forEach(c=>addCard({...c, speak:false}));  // history NEVER speaks
    (d.history||[]).forEach(addLog);
    if(d.state) refresh(d.state);
    fetch('/state').then(r=>r.json()).then(s=>{ renderContacts(s.contact_tree||s.profile?null:null);
      $('agentname').textContent=s.agent_name||'安安';
      $('hello').childNodes[0].textContent=(s.profile?.name||'')+', 您好 ☁️';
      state.med=s?.med?.name||''; if(s.contact_tree) renderContacts(s.contact_tree); });
  }
  if(d.kind==='elder_card'){ addCard(d.card); beat(); }
  if(d.kind==='event'){ addLog(d.event); if(d.state) refresh(d.state);
    if(d.event.kind==='heartbeat'||d.event.kind==='transition') beat(); }
};
function refresh(s){ $('clock').textContent=s.time.slice(11,16); }
</script>
</body>
</html>
