<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安安 · Health Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@19",
  "react-dom/client": "https://esm.sh/react-dom@19/client",
  "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
  "@mediapipe/tasks-vision": "/health-lab/mp-wrap.js",
  "useVoice-shim": "/health-lab/useVoice.js"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  body { background:#0b0f17; margin:0; }
  #topbar { font-family:system-ui,sans-serif; display:flex; align-items:center; gap:8px;
            padding:10px 12px; position:sticky; top:0; background:rgba(11,15,23,.92);
            backdrop-filter:blur(8px); z-index:50; }
  #topbar .back { color:#e8edf5; text-decoration:none; font-size:14px; padding:8px 12px;
                  background:#1c2536; border-radius:10px; white-space:nowrap; }
  #topbar .tabs { display:flex; gap:6px; margin-left:auto; }
  #topbar .tabs a { color:#9aa6b8; text-decoration:none; font-size:13px; padding:8px 12px;
                    border-radius:10px; white-space:nowrap; }
  #topbar .tabs a.on { background:#26324a; color:#fff; }
  #privacy { font-family:system-ui; font-size:11px; color:#5d6a7d; text-align:center; padding:6px; }
  /* their pages' root is `flex-1 … relative` with absolute-inset children —
     it NEEDS a flex-column parent of definite height, exactly like the
     original Next layout gave it. Without this: zero-height box, blank page. */
  #root { display:flex; flex-direction:column; height:calc(100vh - 118px); min-height:420px; }
  #root > div { flex:1; min-height:0; }
  #loading { color:#9aa6b8; font-family:system-ui; padding:40px; text-align:center; }
</style>
</head>
<body>
<div id="topbar">
  <a class="back" href="/elder?s=health">← 安安</a>
  <div class="tabs">
    <a href="?game=heart-rate" data-g="heart-rate">❤️ Heart</a>
    <a href="?game=mobility" data-g="mobility">🪑 Mobility</a>
    <a href="?game=camera" data-g="camera">😊 Smile</a>
  </div>
</div>
<div id="privacy">Camera stays on this device — only the score leaves. 画面不离开设备, 只上传分数。</div>
<div id="stages" style="font-family:ui-monospace,monospace; font-size:11px; display:flex; gap:6px;
     flex-wrap:wrap; padding:4px 12px 8px;"></div>
<div id="laberr" style="display:none; font-family:system-ui; margin:0 12px 8px; padding:10px 12px;
     border-radius:10px; background:#7a2d22; color:#ffd9d3; font-size:12.5px; line-height:1.5;
     white-space:pre-wrap;"></div>
<script>
  /* stage strip + loud errors: a broken stage must SAY SO on the page */
  const STAGES = ['react','page','mediapipe','camera','detect'];
  const stEl = {};
  const box = document.getElementById('stages');
  STAGES.forEach(n => { const s = document.createElement('span');
    s.style.cssText = 'padding:3px 8px;border-radius:6px;background:#1c2536;color:#8b98ac';
    s.textContent = '○ ' + n; box.appendChild(s); stEl[n] = s; });
  window.__labStage = (name, state, extra = '') => {
    const s = stEl[name]; if (!s) return;
    if (state === 'ok')  { s.style.background = '#173527'; s.style.color = '#6fdc9a'; s.textContent = '✓ ' + name + (extra ? ' ' + extra : ''); }
    if (state === 'run') { s.style.background = '#20304d'; s.style.color = '#8fb4ff'; s.textContent = '… ' + name + (extra ? ' ' + extra : ''); }
    if (state === 'fail'){ s.style.background = '#4d1d16'; s.style.color = '#ff9c8e'; s.textContent = '✗ ' + name + (extra ? ': ' + extra : ''); }
  };
  const errBox = document.getElementById('laberr'); const errs = [];
  window.__labError = (m) => { errs.push(String(m).slice(0, 220));
    errBox.textContent = '⚠️ ' + errs.slice(-3).join('\n⚠️ '); errBox.style.display = 'block'; };
  window.addEventListener('error', e => __labError(e.message || e.type));
  window.addEventListener('unhandledrejection', e => __labError(e.reason && (e.reason.message || e.reason)));
  const _ce = console.error.bind(console);
  console.error = (...a) => { __labError(a.map(x => x && (x.message || x)).join(' ')); _ce(...a); };
  /* BROWSER LAW: camera exists only on HTTPS or localhost. On plain HTTP there
     is NO prompt, ever — say so up front with the working link. */
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    __labStage('camera', 'fail', 'HTTP page — browser forbids camera here');
    errBox.style.display = 'block';
    errBox.innerHTML = '⚠️ 这个地址用不了摄像头 (浏览器规定: 只有 HTTPS 或本机可以)。不会弹出任何权限询问。<br>'
      + 'This address cannot use a camera — browsers only allow it on HTTPS or localhost. No prompt will ever appear here.<br>'
      + '👉 <a style="color:#ffd9d3;font-weight:700" href="https://anan-iax1.onrender.com'
      + location.pathname + location.search + '">打开 HTTPS 版本 Open the HTTPS version</a>';
  }
</script>
<div id="devtoast" style="display:none; position:relative; font-family:system-ui; margin:8px 12px; padding:12px 40px 12px 14px;
     border-radius:12px; background:#26324a; color:#dfe6f3; font-size:13.5px; line-height:1.5;
     opacity:0; transition:opacity .25s ease">
  <span id="devtoast-text"></span>
  <button id="devtoast-x" aria-label="关闭 Close" style="position:absolute; top:6px; right:6px; width:30px; height:30px;
     border:0; border-radius:9px; background:rgba(255,255,255,.14); color:#fff; font-size:17px; line-height:1;
     cursor:pointer; -webkit-tap-highlight-color:transparent">×</button>
  <div style="height:3px; background:rgba(255,255,255,.18); border-radius:2px; margin-top:8px; overflow:hidden">
    <i id="devtoast-bar" style="display:block; height:100%; background:#35c26e; width:100%"></i></div>
</div>
<script>
(async () => {
  const game = new URLSearchParams(location.search).get('game') || 'heart-rate';
  let cams = 0;
  try { cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput').length; }
  catch (e) { cams = navigator.mediaDevices ? 1 : 0; }
  const isPhone = /Android|iPhone|iPad/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 900);
  const el = document.getElementById('devtoast'), txt = document.getElementById('devtoast-text'),
        bar = document.getElementById('devtoast-bar');
  let msg = '', sticky = false;
  if (cams === 0) { msg = '⚠️ 这台设备没有摄像头 — 请用手机打开。 No camera here — open this on a phone.'; sticky = true;
                    el.style.background = '#7a2d22'; }
  else if (game === 'heart-rate' && !isPhone) msg = '💡 心率检查最好用手机 (后置镜头+闪光灯); 电脑摄像头信号会偏弱。 Heart rate works best on a phone (rear camera + flash) — a webcam signal is weak.';
  else if (isPhone) msg = '✅ 手机很适合这个检查。 This phone is ideal for this check.';
  else msg = '✅ 这台电脑的摄像头可以做这个检查。 This webcam works for this check.';
  txt.textContent = msg;
  el.style.display = 'block';
  const hide = () => { el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 300); };
  document.getElementById('devtoast-x').onclick = hide;
  requestAnimationFrame(() => { el.style.opacity = '1';
    if (!sticky) { bar.style.transition = 'width 7000ms linear'; requestAnimationFrame(() => bar.style.width = '0'); } });
  if (!sticky) setTimeout(hide, 7000);
})();
</script>
<script>
  const _g = new URLSearchParams(location.search).get('game') || 'heart-rate';
  document.querySelectorAll('#topbar .tabs a').forEach(a =>
    a.classList.toggle('on', a.dataset.g === _g));
</script>
<div id="root"><div id="loading">Loading the check…</div></div>
<script>
/* Desktop repair: pages request the REAR camera (facingMode:'environment'),
   which desktops don't have → NotFoundError with no prompt. Retry any camera.
   (On a desktop webcam, fingertip PPG has no torch — phone is the real venue.) */
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  const orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
  const camOk = (s) => { try { const t = s.getVideoTracks()[0].getSettings();
    window.__labStage && __labStage('camera', 'ok', `${t.width}×${t.height}`); } catch (e) {} return s; };
  navigator.mediaDevices.getUserMedia = async (c) => {
    window.__labStage && __labStage('camera', 'run');
    try { return camOk(await orig(c)); }
    catch (e) {
      window.__labStage && __labStage('camera', 'fail', e.name);
      if (c && c.video && (e.name === 'NotFoundError' || e.name === 'OverconstrainedError')) {
        console.warn('requested camera not found — falling back to any camera');
        return await orig({ video: true, audio: c.audio || false });
      }
      if (e.name === 'NotReadableError' || e.name === 'AbortError') {
        // camera busy (another tab/app holds it): give the OS a beat, retry once
        console.warn('camera busy — retrying in 1.2s');
        await new Promise(r => setTimeout(r, 1200));
        return await orig({ video: true, audio: c && c.audio || false });
      }
      throw e;
    }
  };
}

/* Autoplay repair: React renders `muted` as a property, never as an attribute, so a
   <video autoPlay muted> from these pages is NOT muted in the DOM and phones refuse to
   start it — the preview stays black with the camera light on. Force every video that
   receives a stream to be muted, inline, and playing. */
(() => {
  const arm = (v) => {
    if (!v || v.__ananArmed) return;
    v.__ananArmed = true;
    v.muted = true; v.defaultMuted = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('autoplay', '');
    const kick = () => v.play().catch(() => {});
    v.addEventListener('loadedmetadata', kick); v.addEventListener('loadeddata', kick); kick();
  };
  const sweep = () => document.querySelectorAll('video').forEach(v => { if (v.srcObject) arm(v); });
  new MutationObserver(sweep).observe(document.documentElement, { childList: true, subtree: true });
  setInterval(sweep, 500);
  // last resort on locked-down browsers: the first tap resumes any stalled preview
  addEventListener('pointerdown', () => document.querySelectorAll('video').forEach(v => {
    if (v.srcObject && v.paused) v.play().catch(() => {});
  }), { passive: true });
})();
</script>
<script type="module">
const GAMES = { 'heart-rate':'/health-lab/heart-rate.tsx',
                'mobility':'/health-lab/mobility.tsx',
                'camera':'/health-lab/camera.tsx' };
const game = new URLSearchParams(location.search).get('game') || 'heart-rate';
const src = GAMES[game] || GAMES['heart-rate'];
try {
  __labStage('page', 'run');
  const tsx = await (await fetch(src)).text();
  const js = Babel.transform(tsx.replace(/^['"]use client['"];?\s*/, ''), {
    filename: src,
    presets: [["typescript", {isTSX:true, allExtensions:true}],
              ["react", {runtime:"automatic"}]],
  }).code;
  const blob = new Blob([js], {type:'text/javascript'});
  const mod = await import(URL.createObjectURL(blob));
  const React = await import('react');
  const { createRoot } = await import('react-dom/client');
  __labStage('react', 'ok');
  const Page = mod.default;
  createRoot(document.getElementById('root')).render(React.createElement(Page));
  __labStage('page', 'ok', game);
} catch (e) {
  __labStage('page', 'fail', String(e).slice(0, 80));
  __labError(e);
  document.getElementById('root').innerHTML =
    `<div id="loading">This check could not load: ${String(e).slice(0,200)}<br>
     Needs internet for React/MediaPipe CDN, and HTTPS/localhost for the camera.</div>`;
  console.error(e);
}
</script>
</body>
</html>
